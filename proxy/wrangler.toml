name = "jimbuddy-proxy"
main = "src/worker.ts"
compatibility_date = "2026-09-01"

# Per-user daily caps live in KV. Create it once:
#   npx wrangler kv namespace create USAGE
# and paste the id below.
[[kv_namespaces]]
binding = "USAGE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
MODEL = "gpt-5.6-luna"
DAILY_CAP = "20"

# Secrets (never commit these):
#   npx wrangler secret put OPENAI_API_KEY
#   npx wrangler secret put INVITE_TOKENS     # comma-separated, one per friend, e.g. "shravan-7f3k,ravi-9q2m"
